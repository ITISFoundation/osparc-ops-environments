{{- $logs := index .Values "victoria-logs-cluster" }}
{{- $vmauthPort := trimPrefix ":" (index $logs.vmauth.http 0).value }}
{{- $insertPort := trimPrefix ":" (index $logs.vlinsert.http 0).value }}
{{- $selectPort := trimPrefix ":" (index $logs.vlselect.http 0).value }}
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: vmauth-network-policy
spec:
  selector: >-
    app.kubernetes.io/instance == "{{ .Release.Name }}"
    && app.kubernetes.io/name == "victoria-logs-cluster"
    && app == "vmauth"
  types:
    - Ingress
    - Egress
  ingress:
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - {{ $vmauthPort }}
  egress:
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - {{ $insertPort }}
          - {{ $selectPort }}
    - action: Allow
      protocol: UDP
      destination:
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - 53
