apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kubernetes-pods-extra
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | trunc 63 }}
    app.kubernetes.io/instance: {{ .Release.Name | trunc 63 }}
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  groups:
    - name: kubernetes-pods-extra
      rules:
        - alert: TooManyUnhealthyPods
          expr: |
            count by (namespace) (
              kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} == 1
            ) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            description: >-
              Too many unhealthy pods in the namespace. It might be an indication of
              an ongoing problem or an accumulation of failing pods over time
            summary: >-
              {{`{{ $value }}`}} unhealthy pods (Pending/Failed/Unknown)
              in namespace {{`{{ $labels.namespace }}`}}

        - alert: TooManyPodsInNamespace
          expr: count by (namespace) (kube_pod_status_phase == 1) > 30
          for: 15m
          labels:
            severity: info
          annotations:
            description: >-
              Too many pods in the namespace. It might be an indication of a misconfiguration
              or an accumulation of pods over time
            summary: >-
              {{`{{ $value }}`}} pods in namespace {{`{{ $labels.namespace }}`}}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: vmsingle-federated
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | trunc 63 }}
    app.kubernetes.io/instance: {{ .Release.Name | trunc 63 }}
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  groups:
    - name: vmsingle-federated
      rules:
        - alert: DiskRunsOutOfSpace
          expr: |
            sum(vm_data_size_bytes{job="vmsingle-federated"}) by(job, instance) /
            (
              sum(vm_free_disk_space_bytes{job="vmsingle-federated"}) by(job, instance) +
              sum(vm_data_size_bytes{job="vmsingle-federated"}) by(job, instance)
            ) > 0.7
          for: 30m
          labels:
            severity: info
          annotations:
            dashboard: {{`"{{ $externalURL }}/d/wNf0q_kZk?viewPanel=53&var-instance={{ $labels.instance }}"`}}
            summary: >-
              Instance {{`{{ $labels.instance }}`}} (job={{`{{ $labels.job }}`}}) will run out of disk space soon
            description: >-
              Disk utilisation on instance {{`{{ $labels.instance }}`}} is more than 70%.
              Having less than 30% of free disk space could cripple merge processes and overall performance.
              Consider to limit the ingestion rate, decrease retention or scale the disk space if possible.
        - alert: NoMetricsIngested
          # vmagent -> federated remote-write can fail silently; catch a stalled write path
          expr: sum(rate(vm_rows_inserted_total{job="vmsingle-federated"}[5m])) == 0
          for: 15m
          labels:
            severity: info
          annotations:
            description: >-
              vmsingle-federated has not ingested any samples in the last 15 minutes.
              Check vmagent additionalRemoteWrites and network policies.
            summary: >-
              vmsingle-federated is not receiving metrics
