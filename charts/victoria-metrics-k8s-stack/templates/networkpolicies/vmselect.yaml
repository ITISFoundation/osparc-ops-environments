{{- $stack := index .Values "vm-k8s-stack" -}}
{{- $selectLabels := $stack.vmcluster.spec.vmselect.podMetadata.labels }}
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: vmselect-network-policy
spec:
  selector: >-
    app.simcore.io/name == "{{ index $selectLabels "app.simcore.io/name" }}"
    && app.simcore.io/part-of == "{{ index $selectLabels "app.simcore.io/part-of" }}"
  types: # calico only defaults this on create, so it must be explicit
    - Ingress
    - Egress
  ingress:
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - {{ $stack.vmcluster.spec.vmselect.port }}
  egress:
    - action: Allow
      protocol: TCP
      destination:
        selector: >-
          app.simcore.io/name == "vmstorage"
          && app.simcore.io/part-of == "{{ .Release.Name }}"
        ports:
          - {{ $stack.vmcluster.spec.vmstorage.vmSelectPort }}
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: 'kubernetes.io/metadata.name == "alerting"'
        selector: >-
          app.simcore.io/name == "vmalert"
          && app.simcore.io/part-of == "victoria-metrics-alert"
        ports:
          - 8080 # vmalert HTTP service (VMUI proxy)
