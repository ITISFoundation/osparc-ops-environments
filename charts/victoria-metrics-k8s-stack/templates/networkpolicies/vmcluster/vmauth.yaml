{{- $stack := index .Values "vm-k8s-stack" -}}
{{- if dig "vmcluster" "enabled" false $stack }}
{{- $vmauthLabels := $stack.vmauth.spec.podMetadata.labels }}
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: vmauth-network-policy
spec:
  selector: >-
    app.simcore.io/name == "{{ index $vmauthLabels "app.simcore.io/name" }}"
    && app.simcore.io/part-of == "{{ index $vmauthLabels "app.simcore.io/part-of" }}"
  types: # calico only defaults this on create, so it must be explicit
    - Ingress
    - Egress
  ingress:
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - {{ $stack.vmauth.spec.port }}
  egress:
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - {{ $stack.vmcluster.spec.vminsert.port }}
          - {{ $stack.vmcluster.spec.vmselect.port }}
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - {{ .Values.kubernetesApiServerPort }}
{{- end }}
