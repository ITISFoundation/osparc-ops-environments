{{- $federated := .Values.federatedVmsingle -}}
{{- if $federated.enabled -}}
{{- $trimmedPathPrefix := $federated.httpPathPrefix | trimSuffix "/" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vmsingle-federated
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name | trunc 63 }}
    app.kubernetes.io/instance: {{ .Release.Name | trunc 63 }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.basicAuthMiddleware | quote }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ $federated.ingress.host | quote }}
      http:
        paths:
          - path: {{ $trimmedPathPrefix | quote }}
            pathType: Prefix
            backend:
              service:
                # operator naming convention: vmsingle-<cr-name>
                name: vmsingle-federated
                port:
                  number: {{ $federated.port }}
{{- end }}
