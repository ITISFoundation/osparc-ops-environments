{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" -}}
{{- with $ -}}

{{- $fileName := base $path -}}
{{- $name := (trimSuffix (ext $fileName) $fileName) | replace "_" "-" -}}

{{- $content := .Files.Get $path
  | replace "__DS_UID__" .Values.metricsDatasourceUid -}}

apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ $name }}-grafana-dashboard
  labels:
    grafana_dashboard: true_string
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name | trunc 63 }}
    app.kubernetes.io/instance: {{ .Release.Name | trunc 63 }}
  annotations:
    dashboard_folder: "OPS Apps"
data:
  dashboard.json: | {{ $content | nindent 4 }}
---
{{ end }}
{{ end }}
