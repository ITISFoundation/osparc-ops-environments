# https://github.com/grafana-community/helm-charts/blob/grafana-12.4.4/charts/grafana/README.md#sidecar-for-datasources
{{- $pathPrefix := index .Values "victoria-traces-single" "server" "extraArgs" "http.pathPrefix" }}

apiVersion: v1
kind: Secret
metadata:
  name: victoria-traces-grafana-datasource
  labels:
    # special label to be picked up by the grafana sidecar
    grafana_datasource: true_string
    # TODO: add reusable common labels
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ .Chart.Name | trunc 63 }}
    app.kubernetes.io/instance: {{ .Release.Name | trunc 63 }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
stringData:
  # https://grafana.com/docs/grafana/latest/datasources/tempo/configure-tempo-data-source/provision/
  # https://docs.victoriametrics.com/victoriatraces/querying/grafana/#grafana-tempo-datasource
  datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: VictoriaTraces
        type: tempo
        uid: victoria-traces
        access: proxy
        url: http://{{ include "tracing-stack.vtHost" . }}:{{ .Values.victoriaTracesHttpPortNumber }}{{ $pathPrefix }}/select/tempo
        # if edited in grafana, the datasource will be out-of-sync (helm won't notice the change)
        editable: false
