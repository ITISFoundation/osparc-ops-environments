apiVersion: batch/v1
kind: Job
metadata:
  name: telemetrygen-traces
  namespace: tracing-stack
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetrygen
        app.kubernetes.io/part-of: tracing-stack
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
          args:
            - traces
            - --otlp-endpoint=tracing-stack-opentelemetry-collector.tracing-stack.svc.cluster.local:4317
            - --otlp-insecure
            - --service=demo-service
            - --traces=20
            - --rate=5
            - --child-spans=3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
# egress-only policy so the job can reach the otel collector past the global default-deny
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: telemetrygen-network-policy
  namespace: tracing-stack
spec:
  selector: >-
    app.kubernetes.io/name == "telemetrygen"
    && app.kubernetes.io/part-of == "tracing-stack"
  types:
    - Egress
  egress:
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - 4317
