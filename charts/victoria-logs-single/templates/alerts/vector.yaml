apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ .Release.Name }}-vector
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | trunc 63 }}
    app.kubernetes.io/instance: {{ .Release.Name | trunc 63 }}
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  groups:
    - name: vl-vector-logs-collector
      rules:
        - alert: VectorMetricsAbsent
          expr: absent(vector_build_info)
          for: 15m
          labels:
            severity: info
          annotations:
            summary: >-
              vector_build_info is absent. Either no vector pod is running or scraping
              is broken. Other vector alerts are probably useless, since no vector metrics
              are present

        - alert: VectorSinkErrors
          expr: |
            sum by (component_id, component_type) (
              rate(vector_component_errors_total{component_kind="sink"}[5m])
            ) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Vector sink {{`{{ $labels.component_id }}`}} ({{`{{ $labels.component_type }}`}})
              has been failing continuously. No logs from this source are being gathered.

        - alert: VectorBufferNearlyFull
          expr: |
            sum by (component_id, component_type) (vector_buffer_byte_size)
            / sum by (component_id, component_type) (vector_buffer_max_byte_size)
            > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Vector disk buffer for sink {{`{{ $labels.component_id }}`}}
              ({{`{{ $labels.component_type }}`}}) is {{`{{ $value | humanizePercentage }}`}}
              is almost full. At 100% logs will be missing.

        - alert: VectorEventsDiscarded
          expr: |
            sum by (component_id, component_type) (
              rate(vector_component_discarded_events_total[5m])
            ) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Vector component {{`{{ $labels.component_id }}`}} ({{`{{ $labels.component_type }}`}})
              is dropping events ({{`{{ $value | humanize }}`}}/s). These logs are lost permanently.

        - alert: VectorSourceNoEventsReceived
          expr: |
            sum by (component_id, component_type) (
              rate(vector_component_received_events_total{component_kind="source"}[5m])
            ) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Vector source {{`{{ $labels.component_id }}`}} ({{`{{ $labels.component_type }}`}})
              is not receiving events

        - alert: VectorSinkNoEventsSent
          expr: |
            sum by (component_id, component_type) (
              rate(vector_component_sent_events_total{component_kind="sink"}[5m])
            ) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Vector sink {{`{{ $labels.component_id }}`}} ({{`{{ $labels.component_type }}`}})
              is not sending events
        - alert: VectorDockerSwarmContainerLogsNotSentToKubernetes
          # metrics is absent if no syslogs have been ever sent to Kubernetes
          # because in this case vector does not initalize metrics. `or vector(0)`
          # ensures the alert triggers in this case as well
          expr: |
            (
              sum(rate(vector_component_sent_events_total{component_id="docker-logs-to-kubernetes-victoria-logs"}[5m]))
              or vector(0)
            ) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: No Docker Swarm container logs have been sent to Kubernetes
        - alert: VectorDockerSwarmSyslogsNotSentToKubernetes
          expr: |
            (
              sum(rate(vector_component_sent_events_total{component_id="syslogs-to-kubernetes-victoria-logs"}[5m]))
              or vector(0)
            ) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: No Docker Swarm syslogs have been sent to Kubernetes
