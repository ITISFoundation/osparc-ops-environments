{{- $roleName := printf "%s-%s-%s" .Release.Namespace .Release.Name "cluster-role-extension" -}}

# Cluster-scoped read-only extras that the built-in `view` ClusterRole omits.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $roleName }}
rules:
  - apiGroups: [""] # nodes and storage views
    resources:
      - nodes
      - persistentvolumes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"] # storage view
    resources:
      - storageclasses
      - volumeattributesclasses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"] # cluster overview
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"] # network ingress classes view
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $roleName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.headlamp.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
