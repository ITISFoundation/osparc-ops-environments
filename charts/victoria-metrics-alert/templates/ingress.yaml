apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vmalert
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.vmalert.ingress.basicAuthMiddleware | quote }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.vmalert.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.vmalert.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: vmalert-{{ .Values.vmalert.name }}
                port:
                  number: {{ .Values.vmalert.port }}
