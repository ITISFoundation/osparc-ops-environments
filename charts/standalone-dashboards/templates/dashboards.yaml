{{- define "standalone-dashboards.configmap" -}}
{{- $root := .root -}}
{{- $name := .name -}}
{{- $folder := .folder -}}
{{- $content := $root.Files.Get .path
  | replace "__DS_UID__" $root.Values.metricsDatasourceUid
  | replace "__DS_TYPE__" $root.Values.metricsDatasourceType
  | replace "__LOGS_DS_UID__" $root.Values.logsDatasourceUid
  | replace "__LOGS_DS_TYPE__" $root.Values.logsDatasourceType -}}
{{- if not $content }}
{{- fail (printf "dashboard file %q is empty" .path) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ $root.Release.Namespace }}
  name: {{ $name | replace "_" "-" }}-grafana-dashboard
  labels:
    grafana_dashboard: true_string
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: {{ $root.Chart.Name | trunc 63 }}
    app.kubernetes.io/instance: {{ $root.Release.Name | trunc 63 }}
    helm.sh/chart: {{ printf "%s-%s" $root.Chart.Name $root.Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
  annotations:
    dashboard_folder: {{ $folder | quote }}
data:
  {{ $name }}.json: | {{ $content | nindent 4 }}
---
{{- end -}}

{{- range $path, $_ := .Files.Glob "files/dashboards/*/*/*.json" }}

{{- $parts := splitList "/" (trimPrefix "files/dashboards/" (dir $path)) }}
{{- $flavor := index $parts 0 }}
{{- $folder := index $parts 1 }}

{{- if not (hasKey $.Values.flavors $flavor) }}
{{- fail (printf "dashboard file %q uses unknown flavor %q" $path $flavor) }}
{{- end }}

{{- if (index $.Values.flavors $flavor).enabled }}
{{- include "standalone-dashboards.configmap" (dict
  "root" $
  "name" (trimSuffix ".json" (base $path))
  "folder" $folder
  "path" $path
) }}
{{- end }}

{{- end }}
