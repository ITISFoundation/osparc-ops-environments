services:
  opencode:
    build: .
    volumes:
      - ../..:/workspace
      - opencode-data:/home/opencode/.local/share/opencode # sessions, auth
      - ./opencode-config:/home/opencode/.config/opencode # config, prompts, skills
    stdin_open: true
    tty: true

networks:
  kind:
    external: true

volumes:
  opencode-data:
