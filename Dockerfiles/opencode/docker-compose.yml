services:
  opencode:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    volumes:
      - ../..:/workspace
      - osparc-ops-opencode-data:/home/opencode/.local/share/opencode # sessions, auth
      - ./opencode-config:/home/opencode/.config/opencode # config, prompts, skills
    stdin_open: true
    tty: true

networks:
  kind:
    external: true

volumes:
  osparc-ops-opencode-data:
